{% extends 'base.html' %}

{% block title %}Select Movie{% endblock %}

{% block content %}
<div class="container">
    <h1 class="heading">Select Movie</h1>
  {% for key,value in movies.items() %}
  <p>
    <a href="{{ url_for('find_movie', id=key) }}"> {{value["title"]}} - {{value["year"]}}</a>
  </p>
{% endfor %}
</div>
{% endblock %}
